name: ci

on:
  push:
  pull_request:
  # Normally redundant, since every iteration is a push. Added because during the
  # Actions outage of 2026-08-06 two pushes created no run at all, leaving a fix
  # with nothing to test it and no way to ask for one.
  workflow_dispatch:

jobs:
  # macOS rather than Linux: Linux is covered by developing on it, whereas this
  # is the only place Apple's clang, ld64 and SDK are exercised — where the
  # portability bugs turned up — and the only place the gates can run on an
  # Apple target without a device. iOS then adds cross-compilation on top of a
  # target already known good.
  engine:
    name: macos-arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      # MPFR runs autoreconf before configuring, and the runner image does not
      # ship autoconf, automake or libtool.
      #
      # Via brew rather than mise, which pins everything else here: none of the
      # three are in mise's registry, and they are not the kind of thing its
      # backends carry — aqua and ubi distribute release binaries, while these are
      # GNU shell-script tooling. So they are unpinned, unlike cmake and ninja.
      # Tolerable because they only regenerate a configure script and never touch
      # the engine's output, which the gates would catch anyway.
      - name: Install autotools
        # texinfo too: autoreconf regenerates MPFR's build system, after which
        # make wants to rebuild mpfr.info and needs makeinfo to do it.
        run: brew install autoconf automake libtool texinfo

      # The autotools dependencies are handed CC as an absolute path inside
      # Xcode.app with CFLAGS that carry -mmacosx-version-min but no -isysroot,
      # so clang has no SDK to link against and even "int main(){return 0;}"
      # fails — which is exactly the probe GMP's configure gives up on. clang
      # honours SDKROOT from the environment, so set it for the whole job.
      - name: Point the toolchain at an SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Fetch and patch the engine
        run: mise run fetch

      # Cheap, and it catches a patch that has drifted from the checkout it was
      # taken from — which otherwise only shows up as a build that works on the
      # author's machine and nowhere else.
      - name: Check the patch stack reproduces the checkout
        run: mise run check-patches

      # Dependencies change only when the pin or the patch stack moves, so in
      # steady state this restores instead of building, and during bring-up a
      # failure does not discard the ones that already succeeded.
      - name: Cache dependency prefix
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps-prefix
          key: deps-macos-arm64-${{ hashFiles('scripts/fetch-orca.sh', 'patches/*.patch') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mise run deps
        env:
          ORCA_DEPS_NPROC: 4
          # Orca's superbuild defaults the deployment target to macOS 11.3, which
          # current Xcode will not target: every GMP compile probe fails and its
          # configure reports "could not find a working compiler".
          # CMAKE_OSX_ARCHITECTURES is not optional here: OpenSSL's recipe builds
          # its Configure target as "darwin64-${CMAKE_OSX_ARCHITECTURES}-cc", so
          # leaving it unset asks OpenSSL for "darwin64--cc" and it rejects the
          # target. It also feeds the superbuild's cross-compile detection.
          DEPS_CMAKE_EXTRA: >-
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
            -DCMAKE_OSX_ARCHITECTURES=arm64

      # autotools dependencies explain themselves in config.log and nowhere else.
      # The whole file, because the failing compile probes are in the middle of it
      # and the tail is just a variable dump.
      - name: Collect configure logs
        if: failure()
        run: |
          find build/deps -name config.log -print -exec cat {} \; || true

      - name: Build the engine and harness
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-prefix/usr/local"
          cmake --build build/ci --target slicepad-gate slicepad-cli --parallel 4

      # The point of the whole exercise: the engine still reproduces desktop
      # OrcaSlicer's G-code for a real profile and mesh.
      - name: Run correctness gates
        # Verbose even when green: a passing run should show which gates ran and
        # what they measured, since those numbers are how a platform difference
        # gets noticed.
        run: ctest --test-dir build/ci --verbose

      # Without the actual output there is no way to tell what differs, and each
      # round trip here costs an hour.
      - name: Keep the produced G-code
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gcode-macos-arm64
          path: build/ci/gate-work/*.gcode
          if-no-files-found: warn
