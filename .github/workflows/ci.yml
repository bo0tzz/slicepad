name: ci

on:
  push:
  pull_request:

jobs:
  engine:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the development target and the clean-room check: it proves
          # the patch stack applies and builds from nothing, which a local tree
          # that has been hand-patched cannot.
          - name: linux-gcc
            os: ubuntu-24.04
          # macOS uses Apple's clang, ld64 and SDK with no cross-toolchain file,
          # so it de-risks the Apple toolchain while the gates still execute.
          # iOS adds cross-compilation on top of a target this has cleared.
          - name: macos-arm64
            os: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        # m4 is required by GMP's configure; the rest are autotools deps of the
        # dependency set. No GUI libraries: the engine builds headless.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential m4 autoconf automake libtool pkg-config texinfo

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Fetch and patch the engine
        run: mise run fetch

      # Dependencies change only when the pin or the patch stack moves, so in
      # steady state this restores instead of building. Keyed per target because
      # the artefacts are not portable between them.
      - name: Cache dependency prefix
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps-prefix
          key: deps-${{ matrix.name }}-${{ hashFiles('scripts/fetch-orca.sh', 'patches/*.patch') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mise run deps
        env:
          # Runners have more memory headroom than the dev machine, and this is
          # the cold path we want to keep short.
          ORCA_DEPS_NPROC: 4
          HEAVY_MEM_HIGH: 12G
          HEAVY_MEM_MAX: 14G

      - name: Build the engine and harness
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-prefix/usr/local"
          cmake --build build/ci --target slicepad-gate slicepad-cli --parallel 4
        env:
          BUILD_JOBS: 4

      # The point of the whole exercise: the engine still reproduces desktop
      # OrcaSlicer's G-code for a real profile and mesh.
      - name: Run correctness gates
        run: ctest --test-dir build/ci --output-on-failure
