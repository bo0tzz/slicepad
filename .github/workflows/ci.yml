name: ci

on:
  push:
  pull_request:

jobs:
  # macOS rather than Linux: Linux is covered by developing on it, whereas this
  # is the only place Apple's clang, ld64 and SDK are exercised — where the
  # portability bugs turned up — and the only place the gates can run on an
  # Apple target without a device. iOS then adds cross-compilation on top of a
  # target already known good.
  engine:
    name: macos-arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Fetch and patch the engine
        run: mise run fetch

      # Dependencies change only when the pin or the patch stack moves, so in
      # steady state this restores instead of building, and during bring-up a
      # failure does not discard the ones that already succeeded.
      - name: Cache dependency prefix
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps-prefix
          key: deps-macos-arm64-${{ hashFiles('scripts/fetch-orca.sh', 'patches/*.patch') }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mise run deps
        env:
          ORCA_DEPS_NPROC: 4

      - name: Build the engine and harness
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-prefix/usr/local"
          cmake --build build/ci --target slicepad-gate slicepad-cli --parallel 4

      # The point of the whole exercise: the engine still reproduces desktop
      # OrcaSlicer's G-code for a real profile and mesh.
      - name: Run correctness gates
        run: ctest --test-dir build/ci --output-on-failure
