name: release-please

# Keeps a pull request open with the changelog for everything on main since the
# last release. Merging it tags the version, and the tag is what release.yml
# already builds and publishes from — so this adds the bookkeeping and changes
# nothing about how the app is built.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
