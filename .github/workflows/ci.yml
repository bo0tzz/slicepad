name: ci

on:
  push:
  pull_request:
  # Normally redundant, since every iteration is a push. Added because during the
  # Actions outage of 2026-08-06 two pushes created no run at all, leaving a fix
  # with nothing to test it and no way to ask for one.
  workflow_dispatch:

# One run per branch. Pushing several commits in a row otherwise queues a full
# dependency build for each of them against a five-job macOS limit, so the newest
# commit — the only one worth testing — waits behind work already superseded.
# Safe to cancel now that the dependency cache saves on failure and cancellation:
# the next run resumes from wherever this one stopped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app's own feedback loop, and deliberately independent of the engine build:
  # type checking needs the C ABI's header and nothing behind it, so Swift mistakes
  # surface in a couple of minutes instead of after an hour of dependencies. It
  # cannot catch link errors, which is what the iOS job is for.
  app:
    name: swift-typecheck
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the C module the app imports
        run: |
          mkdir -p build/module
          cp core/include/slicepad.h build/module/
          cat > build/module/module.modulemap <<'MAP'
          module SlicePadCore {
              header "slicepad.h"
              export *
          }
          MAP

      # Same target triple the app is built for, so SwiftUI and SceneKit resolve to
      # the iOS SDK rather than the macOS one.
      - name: Type check the app
        run: |
          xcrun --sdk iphoneos swiftc -typecheck \
            -target arm64-apple-ios17.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -strict-concurrency=complete \
            -I build/module \
            $(find app/SlicePad -name '*.swift')

      # Type checking cannot tell whether the parsing is right, and these are the
      # parts with a wrong answer rather than a compile error: a profile's settings
      # read into the controls, and a typed address turned into a URL. They touch
      # neither the engine nor a screen, so they compile and run natively here
      # rather than needing a simulator.
      - name: Run the app's logic checks
        run: |
          swiftc -o build/appchecks \
            app/SlicePad/Engine/Settings.swift \
            app/SlicePad/Engine/Moonraker.swift \
            app/Tests/main.swift
          ./build/appchecks

  # macOS rather than Linux: Linux is covered by developing on it, whereas this
  # is the only place Apple's clang, ld64 and SDK are exercised — where the
  # portability bugs turned up — and the only place the gates can run on an
  # Apple target without a device. iOS then adds cross-compilation on top of a
  # target already known good.
  engine:
    name: macos-arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      # MPFR runs autoreconf before configuring, and the runner image does not
      # ship autoconf, automake or libtool.
      #
      # Via brew rather than mise, which pins everything else here: none of the
      # three are in mise's registry, and they are not the kind of thing its
      # backends carry — aqua and ubi distribute release binaries, while these are
      # GNU shell-script tooling. So they are unpinned, unlike cmake and ninja.
      # Tolerable because they only regenerate a configure script and never touch
      # the engine's output, which the gates would catch anyway.
      - name: Install autotools
        # texinfo too: autoreconf regenerates MPFR's build system, after which
        # make wants to rebuild mpfr.info and needs makeinfo to do it.
        run: brew install autoconf automake libtool texinfo

      # The autotools dependencies are handed CC as an absolute path inside
      # Xcode.app with CFLAGS that carry -mmacosx-version-min but no -isysroot,
      # so clang has no SDK to link against and even "int main(){return 0;}"
      # fails — which is exactly the probe GMP's configure gives up on. clang
      # honours SDKROOT from the environment, so set it for the whole job.
      - name: Point the toolchain at an SDK
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Fetch and patch the engine
        run: mise run fetch

      # Cheap, and it catches a patch that has drifted from the checkout it was
      # taken from — which otherwise only shows up as a build that works on the
      # author's machine and nowhere else.
      - name: Check the patch stack reproduces the checkout
        run: mise run check-patches

      # Dependencies change only when the pin or the patch stack moves, so in
      # steady state this restores instead of building, and during bring-up a
      # failure does not discard the ones that already succeeded.
      # Key the cache on the dependency recipes themselves rather than on the whole
      # patch stack. A patch to src/libslic3r cannot change what the dependencies
      # build to, but it does change hashFiles('patches/*.patch') — which threw
      # away a 40-minute build for a one-line fix in a single engine source file.
      - name: Fingerprint the dependency sources
        id: deps-fp
        run: |
          hash=$(find third_party/orcaslicer/deps -type f -print0 \
                 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Cache dependency prefix
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/deps-prefix
          key: deps-macos-arm64-${{ steps.deps-fp.outputs.hash }}

      - name: Build dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: mise run deps
        env:
          ORCA_DEPS_NPROC: 4
          # Orca's superbuild defaults the deployment target to macOS 11.3, which
          # current Xcode will not target: every GMP compile probe fails and its
          # configure reports "could not find a working compiler".
          # CMAKE_OSX_ARCHITECTURES is not optional here: OpenSSL's recipe builds
          # its Configure target as "darwin64-${CMAKE_OSX_ARCHITECTURES}-cc", so
          # leaving it unset asks OpenSSL for "darwin64--cc" and it rejects the
          # target. It also feeds the superbuild's cross-compile detection.
          DEPS_CMAKE_EXTRA: >-
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
            -DCMAKE_OSX_ARCHITECTURES=arm64

      # autotools dependencies explain themselves in config.log and nowhere else.
      # The whole file, because the failing compile probes are in the middle of it
      # and the tail is just a variable dump.
      - name: Collect configure logs
        if: failure()
        run: |
          find build/deps -name config.log -print -exec cat {} \; || true

      - name: Build the engine and harness
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-prefix/usr/local"
          cmake --build build/ci --target slicepad-gate slicepad-cli --parallel 4

      # The point of the whole exercise: the engine still reproduces desktop
      # OrcaSlicer's G-code for a real profile and mesh.
      - name: Run correctness gates
        # Verbose even when green: a passing run should show which gates ran and
        # what they measured, since those numbers are how a platform difference
        # gets noticed.
        run: ctest --test-dir build/ci --verbose

      # Without the actual output there is no way to tell what differs, and each
      # round trip here costs an hour.
      - name: Keep the produced G-code
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gcode-macos-arm64
          path: build/ci/gate-work/*.gcode
          if-no-files-found: warn

  # The only place any of this actually runs on an iOS platform. The device job
  # proves it compiles and links; this proves the engine still slices correctly
  # there, and that the app survives its own launch.
  #
  # A separate dependency build, because the simulator is a third Apple platform
  # rather than a flavour of the device: different sysroot, different Mach-O
  # platform id, and objects built for one will not link against the other.
  ios-simulator:
    name: ios-simulator
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Point the toolchain at an SDK
        run: echo "SDKROOT=$(xcrun --sdk iphonesimulator --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install autotools
        run: brew install autoconf automake libtool texinfo

      - name: Fetch and patch the engine
        run: mise run fetch

      - name: Check the patch stack reproduces the checkout
        run: mise run check-patches

      - name: Fingerprint the dependency sources
        id: deps-fp
        run: |
          hash=$(find third_party/orcaslicer/deps -type f -print0 \
                 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore dependency build
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-prefix
            build/deps
            build/dl-cache
          key: deps-iossim-arm64-${{ steps.deps-fp.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            deps-iossim-arm64-${{ steps.deps-fp.outputs.hash }}-

      - name: Build dependencies for the simulator
        run: mise run deps
        env:
          ORCA_DEPS_NPROC: 4
          DEPS_CMAKE_EXTRA: >-
            -DCMAKE_SYSTEM_NAME=iOS
            -DCMAKE_SYSTEM_PROCESSOR=arm64
            -DCMAKE_OSX_ARCHITECTURES=arm64
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
            -DCMAKE_OSX_SYSROOT=iphonesimulator

      - name: Collect configure logs
        if: failure()
        run: find build/deps -name config.log -print -exec cat {} + || true

      - name: Save dependency build
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/deps-prefix
            build/deps
            build/dl-cache
          key: deps-iossim-arm64-${{ steps.deps-fp.outputs.hash }}-${{ github.run_id }}

      - name: Build the gates for the simulator
        run: |
          cmake -S . -B build/iossim -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-prefix/usr/local" \
            -DCMAKE_FIND_ROOT_PATH="$PWD/build/deps-prefix/usr/local"
          cmake --build build/iossim --target slicepad-gate --parallel 4

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j \
                 | jq -r '[.devices[][] | select(.isAvailable)][0].udid')
          test -n "$udid" || { echo "no simulator available"; exit 1; }
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"

      # The whole point: the same thirteen gates the desktop passes, run on an iOS
      # platform against the same fixtures and the same reference G-code.
      - name: Run the gates in the simulator
        run: |
          xcrun simctl spawn "$SIM_UDID" "$PWD/build/iossim/slicepad-gate" \
            "$PWD/testdata" "$PWD/build/iossim/gate-work"

      # The xcframework has to be built for the simulator too: an app built for
      # one Apple platform cannot link an archive built for another, and the
      # default here is the device.
      - name: Build the app for the simulator
        env:
          NPROC: 4
          SLICEPAD_SDK: iphonesimulator
        run: |
          ./scripts/build-ios-framework.sh
          mise run app-project
          xcodebuild -project app/SlicePad.xcodeproj -scheme SlicePad \
            -destination "generic/platform=iOS Simulator" -configuration Release \
            -derivedDataPath build/dd-sim CODE_SIGNING_ALLOWED=NO build

      # Launching is the only check that the app survives start-up: creating the
      # engine, finding the resources inside the bundle and the first call across
      # the C ABI all happen before anything is drawn.
      - name: Install the app
        run: |
          xcrun simctl install "$SIM_UDID" \
            build/dd-sim/Build/Products/Release-iphonesimulator/SlicePad.app

      # Launching alone proves less than it looks like: the engine is created on
      # the first profile or model load, so a clean start says nothing about
      # sp_engine_create, the resources directory inside the bundle, or the
      # writable path under Application Support. This drives a real slice through
      # the app's own wiring, with the fixtures inside its sandbox container so
      # the file access is the same as a real install.
      - name: Slice inside the app
        run: |
          container=$(xcrun simctl get_app_container "$SIM_UDID" me.bo0tzz.slicepad data)
          fixtures="$container/Documents/fixtures"
          mkdir -p "$fixtures"
          cp testdata/model.3mf testdata/model-shapr3d.3mf "$fixtures/"

          # simctl passes the child its environment through SIMCTL_CHILD_-prefixed
          # variables; there is no flag for it.
          output=$(SIMCTL_CHILD_SLICEPAD_SMOKE="$fixtures" \
            xcrun simctl launch --console-pty --terminate-running-process \
            "$SIM_UDID" me.bo0tzz.slicepad 2>&1 | tee /dev/stderr)
          echo "$output" | grep -q "SMOKE OK" \
            || { echo "the app could not slice"; exit 1; }

      - name: Launch the app normally
        run: |
          xcrun simctl launch "$SIM_UDID" me.bo0tzz.slicepad
          sleep 10
          xcrun simctl spawn "$SIM_UDID" launchctl list | grep -q me.bo0tzz.slicepad \
            || { echo "the app is no longer running — it died during start-up"; exit 1; }
          echo "app still running after 10s"

      - name: Keep the crash reports
        if: failure()
        run: find ~/Library/Logs/DiagnosticReports -name 'SlicePad*' -exec cat {} + || true

  # The actual target: the dependency set, libslic3r, the C ABI and the app all
  # built for arm64-iOS, packaged as an unsigned .ipa.
  #
  # It builds the engine but does not run it — the gates need a simulator or a
  # device — so a green result here means "compiles, links, and ships what it
  # should", not "slices correctly on an iPad". The macOS job is what checks the
  # output, on the same compiler and architecture.
  ios-deps:
    name: ios-arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Point the toolchain at an SDK
        run: echo "SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"

      - uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install autotools
        run: brew install autoconf automake libtool texinfo

      - name: Fetch and patch the engine
        run: mise run fetch

      - name: Check the patch stack reproduces the checkout
        run: mise run check-patches

      # Split restore from save, and save even when the job fails. Bringing this
      # target up means a long chain of dependencies where each fix reveals the
      # next failure, and a cache that only stores on success makes every one of
      # those rebuild all the ones that already worked. The superbuild's own
      # directory comes along for the same reason: its stamps are what let a
      # retry resume rather than restart. A patch change moves the key, so stale
      # stamps cannot outlive the source they were built from.
      # Key the cache on the dependency recipes themselves rather than on the whole
      # patch stack. A patch to src/libslic3r cannot change what the dependencies
      # build to, but it does change hashFiles('patches/*.patch') — which threw
      # away a 40-minute build for a one-line fix in a single engine source file.
      - name: Fingerprint the dependency sources
        id: deps-fp
        run: |
          hash=$(find third_party/orcaslicer/deps -type f -print0 \
                 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore dependency build
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/deps-prefix
            build/deps
            build/dl-cache
          key: deps-ios-arm64-${{ steps.deps-fp.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            deps-ios-arm64-${{ steps.deps-fp.outputs.hash }}-

      - name: Build dependencies for iOS
        run: mise run deps
        env:
          ORCA_DEPS_NPROC: 4
          DEPS_CMAKE_EXTRA: >-
            -DCMAKE_SYSTEM_NAME=iOS
            -DCMAKE_SYSTEM_PROCESSOR=arm64
            -DCMAKE_OSX_ARCHITECTURES=arm64
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0

      - name: Collect configure logs
        if: failure()
        run: |
          find build/deps -name config.log -print -exec cat {} \; || true

      - name: Save dependency build
        if: always() && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/deps-prefix
            build/deps
            build/dl-cache
          key: deps-ios-arm64-${{ steps.deps-fp.outputs.hash }}-${{ github.run_id }}

      # Building the engine, not running it: the gates need a simulator or a
      # device, which is a later step. This proves libslic3r and the core compile
      # and link for the target.
      - name: Build the engine for iOS
        run: |
          cmake -S . -B build/ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_PREFIX_PATH="$PWD/build/deps-prefix/usr/local" \
            -DCMAKE_FIND_ROOT_PATH="$PWD/build/deps-prefix/usr/local"
          cmake --build build/ios --target slicepad_core --parallel 4

      # The app link is the only thing that proves the ABI is actually reachable
      # from Swift — type checking sees the header and stops there. Unsigned:
      # signing belongs to whoever sideloads it.
      - name: Build the app
        run: mise run ipa
        env:
          NPROC: 4

      # A successful link says the symbols resolved, not that the right things are
      # in the bundle. These are the failures that would otherwise show up on the
      # device: an engine that did not actually get linked in, a build for the
      # wrong platform, or a missing resources directory that makes
      # sp_engine_create fail on launch with nothing to point at.
      - name: Check the built app
        run: |
          app=build/dd/Build/Products/Release-iphoneos/SlicePad.app
          test -x "$app/SlicePad" || { echo "no executable in the bundle"; exit 1; }

          archs=$(lipo -archs "$app/SlicePad")
          [ "$archs" = "arm64" ] || { echo "built for '$archs', expected arm64"; exit 1; }

          vtool -show-build "$app/SlicePad" | grep -q "platform IOS" \
            || { echo "not built for the iOS platform"; exit 1; }

          # A string only libslic3r emits, so this fails if the engine was dropped
          # from the link and the app is a shell around an empty ABI.
          strings "$app/SlicePad" | grep -q "Generating perimeters" \
            || { echo "the slicing engine is not in the binary"; exit 1; }

          test -d "$app/orca-resources" \
            || { echo "orca-resources missing from the bundle"; exit 1; }

          echo "arm64 iOS app, engine linked, resources present"

      # The delivery path: SideStore signs with the installing device's own
      # certificate, so an unsigned .ipa is what it wants.
      - name: Keep the app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SlicePad-unsigned-ipa
          path: build/SlicePad.ipa
          if-no-files-found: error
