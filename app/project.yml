# Generated into an .xcodeproj by XcodeGen (`mise run app-project`).
#
# The project file is not committed: it is a build artifact of this file, and a
# checked-in .xcodeproj is the kind of thing that drifts silently when there is no
# Mac in the inner loop to notice.
name: SlicePad
options:
  bundleIdPrefix: me.bo0tzz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  SlicePad:
    type: application
    platform: iOS
    sources:
      - path: SlicePad
      # A folder reference, so the engine can be handed a directory path. It is
      # empty on purpose: profiles arrive fully resolved from a saved project, and
      # libslic3r only requires the resources directory to exist.
      - path: Resources/orca-resources
        type: folder
      - path: Resources/Assets.xcassets
    # A written plist rather than the synthesised one: the App Transport Security
    # exception is a nested dictionary, and INFOPLIST_KEY_* settings can only
    # express flat values.
    info:
      path: SlicePad/Info.plist
      properties:
        CFBundleDisplayName: SlicePad
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Asked for the first time the app talks to a printer. Without this the
        # system still prompts, but with no reason given — and the request that
        # triggered the prompt fails, which reads as the printer being
        # unreachable when nothing is wrong with it.
        NSLocalNetworkUsageDescription:
          SlicePad sends sliced G-code to a printer on your network.
        # Moonraker on a home network speaks plain HTTP, which App Transport
        # Security blocks by default. Scoped to local addresses rather than
        # turning ATS off: nothing here should be reaching the internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

    dependencies:
      - framework: ../build/SlicePadCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.bo0tzz.slicepad
        # Overridden by the release workflow from the tag, so what the tag claims
        # and what the installed app reports cannot drift apart.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: 2   # iPad
        SWIFT_VERSION: "5.9"
        # The engine is C++; without this the Swift target links the C ABI but not
        # the standard library the implementation behind it needs.
        CLANG_CXX_LIBRARY: libc++
        # Everything libslic3r resolves from the SDK rather than from our own
        # dependency prefix. A static archive can only carry object files, so
        # system libraries and frameworks have to be named again here — the
        # xcframework merge cannot bring them along.
        #
        # This is the full set the engine's configure reported finding in the iOS
        # sysroot: expat, iconv and zlib as .tbd libraries, Accelerate, plus the
        # Foundation and ModelIO that libslic3r links explicitly.
        OTHER_LDFLAGS: >-
          -lc++ -lz -lexpat -liconv
          -framework Foundation -framework ModelIO -framework Accelerate
        # Documents come in through the picker, which is why there is no file
        # sharing here: nothing is meant to live inside the app.
        SWIFT_STRICT_CONCURRENCY: complete
